<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log in | CampusLink</title>
    <meta
      name="description"
      content="Basic CampusLink access with a UPC institutional email"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="icon" type="image/png" href="assets/logo/favicon.png" />
    <link rel="stylesheet" href="css/base.css?v=i18n-v2" />
    <link rel="stylesheet" href="css/login.css?v=i18n-v2" />
  </head>
  <body>
    <a class="loginSkip" href="#login-form">Skip to form</a>

    <main class="loginPage">
      <section class="loginPanel" aria-labelledby="login-title">
        <div class="loginTop">
          <a
            class="loginBack"
            href="index.html"
            aria-label="Back to the CampusLink landing page"
            data-preserve-lang
          >
            Back
          </a>

          <div class="langSelector langSelector--login" role="group" aria-label="Language selector">
            <button type="button" data-lang="es">ES</button>
            <span aria-hidden="true">|</span>
            <button type="button" data-lang="en">EN</button>
          </div>
        </div>

        <div class="loginBrand">
          <img
            class="loginLogo"
            src="assets/logo/campuslink-white-bg.png"
            alt="CampusLink"
          />
        </div>

        <div class="loginHeader">
          <h1 class="loginTitle" id="login-title">Log in</h1>
          <p class="loginText">
            Enter your UPC institutional email to continue in CampusLink.
          </p>
        </div>

        <form class="loginForm" id="login-form" novalidate>
          <div class="loginField" data-login-field="correo">
            <label for="email">Institutional email</label>
            <input
              id="email"
              name="email"
              type="email"
              inputmode="email"
              autocomplete="username"
              placeholder="name@upc.edu.pe"
              required
              aria-describedby="email-help email-error"
            />
            <p class="loginHelp" id="email-help">
              Use your institutional account ending in @upc.edu.pe.
            </p>
            <p class="loginError" id="email-error" aria-live="polite"></p>
          </div>

          <div class="loginField" data-login-field="clave">
            <label for="password">Password</label>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              placeholder="Minimum 8 characters"
              minlength="8"
              required
              aria-describedby="password-help password-error"
            />
            <p class="loginHelp" id="password-help">
              Use your institutional account password.
            </p>
            <p class="loginError" id="password-error" aria-live="polite"></p>
            <button
              class="loginLink loginLinkSecondary"
              type="button"
              data-login-action="recuperar"
            >
              Forgot your password?
            </button>
          </div>

          <button class="loginButton" type="submit">Log in</button>

          <p class="loginRegister">
            <span>Don&rsquo;t have an account?</span>
            <button class="loginLink" type="button" data-login-action="registro">
              Create account
            </button>
          </p>

          <p
            class="loginStatus"
            id="login-status"
            role="status"
            aria-live="polite"
          ></p>
        </form>

      </section>
    </main>

    <script type="module" src="js/login.js?v=i18n-v2"></script>
  </body>
</html>
